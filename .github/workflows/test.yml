name: Brew-tiful Coffee CI / CD Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Run Unit Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXTAUTH_SECRET: 'ci_test_secret_32_chars_minimum_length_for_jwt'
          STRIPE_SECRET_KEY: 'sk_test_mock_key_for_build'
